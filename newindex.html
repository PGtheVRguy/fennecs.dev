<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name = "viewport", content="width=device-width, initial-scale=1.0">
    <title>fennecs.dev</title>

    <link rel="stylesheet" href="/styles.css?version=2">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <script src="/scripts.js"></script>
    <script src="/home.js"></script>
    
    <script>
        function loadProjects() {
        fetch("./projects.json")
            .then((response => response.json()))
            .then(json => {
                const TPL_Results = item => 
                `<div class="Projects-item">
                    <!-- Implement image here too prob -->
                    <a class="projects-title" href=${item.url}>${item.name}</a>
                    <div class="projects-description"><b>${item.date}</b></div>
                    <div class="projects-description"><b>${item.summary}</b></div>
                </div><br>
                
                
                `;
                document.querySelector("#results").innerHTML = json.map(item => TPL_Results(item)).join('');
            })
            .catch(error => console.error('error loading projects: ', error));
    }
        function allScripts() { //I spelt scripts wrong wth
            loadNavbar(); //I lowk dont know JS that well
            loadProjects();
        }
        window.onload = allScripts;
        
    </script>
</head>

<div id="NavBar"></div>




<div class="header">

    <img src="/assets/images/title.png" alt="Title Image" class = "title", width = 40%, height = auto>

    <div id="emitter-container"></div>

</div>
